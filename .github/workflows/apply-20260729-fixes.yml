name: Verify 2026-07-29 release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-20260729-fixes.yml'
      - 'scripts/apply_20260729_fixes.py'
      - 'app.py'
      - 'index.html'
      - 'trial-14.html'
      - 'beta-register.html'
      - 'faq.html'
      - 'liff/**'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify source implementation
        run: python scripts/apply_20260729_fixes.py
      - name: Verify Python syntax
        run: python -m py_compile app.py
      - name: Run focused release tests
        run: python -m unittest tests.test_20260729_release
