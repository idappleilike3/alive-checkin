name: Apply binding celebration patch

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-binding-celebration-patch.yml
      - .github/binding-celebration.patch

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply verified patch
        run: git apply --check .github/binding-celebration.patch && git apply .github/binding-celebration.patch
      - name: Commit final files
        run: |
          rm .github/binding-celebration.patch
          rm .github/workflows/apply-binding-celebration-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py .github
          git commit -m "套用雙方綁定後端修正"
          git push
