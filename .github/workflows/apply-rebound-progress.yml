name: Apply rebound progress fix
on:
  push:
    paths:
      - '.github/workflows/apply-rebound-progress.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply verified patch
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/rebound-progress.patch
          git apply --index /tmp/rebound-progress.patch
          python -m unittest -v tests.test_authoritative_onboarding_progress
          python -m py_compile app.py
          python - <<'PY'
          from pathlib import Path
          data = Path('app.py').read_bytes()
          assert data.count(b'\0') == 0
          assert len(data.splitlines()) > 25000
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-rebound-progress.yml
          git commit -m '修正重新綁定會員進度為 5/5'
          git push origin HEAD:main
