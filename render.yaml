services:
  - type: web
    name: alive-checkin
    env: python
    # Persistent Disk requires a paid instance (Starter+). Free cannot attach disks.
    plan: starter
    buildCommand: python scripts/apply_admin_merge_patch.py && pip install -r requirements.txt
    # The cron tick reads the durable member snapshot and can exceed Gunicorn's
    # 30-second default on a cold Free instance.
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 180
    healthCheckPath: /health
    disk:
      name: alive-checkin-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: LIFF_ID
        value: 2010848330-UAiqPPYD
      - key: APP_PUBLIC_URL
        value: https://alive-checkin.onrender.com/
      - key: APP_TIMEZONE
        value: Asia/Taipei
      # SQLite lives on the Persistent Disk (state.json → state.db sibling).
      - key: DATA_FILE
        value: /var/data/state.json
      - key: REQUIRE_LIFF_AUTH
        value: "1"
      - key: ENABLE_INTERNAL_SCHEDULER
        value: "0"
      - key: AUTO_SYNC_RICH_MENU
        value: "1"
      - key: DEPLOY_VERSION
        value: W260805-jennie-state
      # Prefer Postgres kv_store when DATABASE_URL is set (survives Free redeploys).
      # Persistent Disk (/var/data) still preferred on Starter+.
      - key: DATABASE_URL
        sync: false
      - key: ALLOW_OPEN_ADMIN
        value: "false"
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SESSION_SECRET
        sync: false
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: LINE_LOGIN_CHANNEL_ID
        value: 2010848330
      - key: LEGACY_LINE_LOGIN_CHANNEL_ID
        value: 2010674803
      - key: LEGACY_LIFF_ID
        value: 2010674803-rK98c0lo
      - key: ACCOUNT_MIGRATION_SECRET
        generateValue: true
      - key: CRON_SECRET
        sync: false
      # Daily card cron generates tomorrow's new visual and saves it to /var/data.
      - key: OPENAI_API_KEY
        sync: false
      - key: DAILY_CARD_ASSET_DIR
        value: /var/data/daily-card-assets
      - key: MILESTONE_VIDEO_100_URL
        sync: false
      - key: MILESTONE_VIDEO_365_URL
        sync: false
      - key: ECPAY_MERCHANT_ID
        sync: false
      - key: ECPAY_HASH_KEY
        sync: false
      - key: ECPAY_HASH_IV
        sync: false
      - key: ECPAY_STAGE
        value: sandbox
      - key: ECPAY_PERIOD_TIMES
        value: "99"
      # Never wipe Render Environment Variables — LINE token/secret/LIFF_ID
      # missing makes /callback return 503 and messaging die.
  - type: cron
    name: alive-checkin-scheduler
    env: python
    schedule: "* * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python cron_ping.py /api/cron/tick
    envVars:
      - key: APP_PUBLIC_URL
        value: https://alive-checkin.onrender.com/
      - key: CRON_SECRET
        sync: false
