<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>每日平安登入服務已更新</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: linear-gradient(145deg, #e8f8ee, #f7fcf8);
      color: #1f2937;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
    }
    main {
      width: min(100%, 420px);
      padding: 32px 24px;
      text-align: center;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 12px 36px rgba(22, 101, 52, 0.14);
    }
    h1 { margin: 0 0 16px; color: #087f23; font-size: 24px; }
    p { margin: 0; line-height: 1.7; font-size: 16px; }
    .invite-warning { margin-top: 14px; color: #92400e; }
    .handoff-button {
      display: block;
      margin-top: 28px;
      padding: 15px 20px;
      border-radius: 12px;
      background: #00b900;
      color: #fff;
      font-size: 17px;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <h1>每日平安登入服務已更新</h1>
    <p>請點下方按鈕重新授權；原有資料不會在這一步被刪除。</p>
    <p class="invite-warning">舊版守護人邀請不會移轉；請邀請人從新版重新分享邀請。</p>
    <a id="openNewLiff" class="handoff-button" href="https://liff.line.me/2010848330-UAiqPPYD">重新授權並開啟服務</a>
  </main>
  <script>
    const NEW_LIFF_URL = "https://liff.line.me/2010848330-UAiqPPYD";
    const SAFE_KEYS = ["open", "page", "friend_invite"];

    function parseLiffStateParams(params, value) {
      let raw = String(value || "").trim();
      if (!raw) return;
      try { raw = decodeURIComponent(raw); } catch (_) {}
      raw = raw.replace(/^#/, "");
      if (raw.startsWith("/")) {
        const queryIndex = raw.indexOf("?");
        raw = queryIndex >= 0 ? raw.slice(queryIndex + 1) : "";
      }
      raw = raw.replace(/^\?/, "");
      if (!raw || !raw.includes("=")) return;
      new URLSearchParams(raw).forEach((nestedValue, nestedKey) => {
        params.set(nestedKey, nestedValue);
      });
    }

    function readSourceParams() {
      const params = new URLSearchParams();
      try {
        new URLSearchParams(location.search).forEach((value, key) => {
          if (String(key) === "liff.state") parseLiffStateParams(params, value);
          else params.set(key, value);
        });
      } catch (_) {}
      return params;
    }

    function isLineUserId(value) {
      return /^U[0-9a-f]{32}$/i.test(String(value || "").trim());
    }

    const source = readSourceParams();
    const target = new URL(NEW_LIFF_URL);
    for (const key of SAFE_KEYS) {
      const value = String(source.get(key) || "").trim();
      if (value && !isLineUserId(value)) target.searchParams.set(key, value);
    }
    document.querySelector("#openNewLiff").href = target.toString();
  </script>
</body>
</html>
