<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>今日安心提醒｜每日平安</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#17352b;background:#f3faf5}*{box-sizing:border-box}
    body{margin:0}.wrap{max-width:680px;margin:auto;padding:24px 18px 48px}.brand{display:flex;align-items:center;gap:12px;font-size:24px;font-weight:900}.brand img{width:48px;height:48px;object-fit:contain}
    h1{font-size:36px;line-height:1.25;margin:26px 0 8px;font-weight:900}.lead{font-size:22px;color:#47655b;font-weight:900}.card{background:#fff;border-radius:24px;padding:24px;margin-top:18px;box-shadow:0 10px 30px #14532d16}
    h2{font-size:26px;margin:0 0 12px;font-weight:900}.big{font-size:23px;line-height:1.65;font-weight:900}.meta{color:#64748b;font-size:18px;font-weight:800}.btn{display:block;text-align:center;text-decoration:none;border-radius:16px;padding:17px;margin-top:16px;font-size:22px;font-weight:900;background:#16a34a;color:#fff}.secondary{background:#fff;color:#166534;border:2px solid #16a34a}.reminders{display:grid;gap:12px}.reminder{padding:16px;border-radius:16px;background:#eefaf1;font-size:22px;line-height:1.55;font-weight:900}.empty{color:#587066}
  </style>
</head>
<body><main class="wrap">
  <div class="brand"><img src="/assets/daily-peace-logo.png" alt="每日平安 Logo"><span>每日平安</span></div>
  <h1 id="greeting">今日安心提醒</h1><p class="lead">每天一则，陪你安心过日子。</p>
  <section class="card"><h2>🌤️ 所在地區天氣</h2><div class="big" id="weather">正在讀取天氣資料…</div></section>
  <section class="card"><h2>📝 我的今日提醒</h2><div class="reminders" id="reminders"><div class="reminder">正在讀取備忘錄與生活提醒…</div></div></section>
  <section class="card"><h2>🏅 我的平安等級</h2><div class="big" id="level">正在讀取等級與連續天數…</div><div class="big" id="gameBadge">正在讀取遊戲勳章…</div><div class="big" id="upgradeReward">正在讀取升級特效…</div></section>
  <section class="card"><h2 id="newsTitle">📰 政府與生活重要消息</h2><div class="big" id="newsSummary">正在讀取官方重要資訊…</div><p class="meta" id="source"></p><a class="btn secondary" id="sourceLink" href="#" target="_blank" rel="noopener">查看官方完整資訊</a></section>
  <section class="card"><h2>💛 今日祝福語</h2><div class="big" id="blessing">正在讀取今日祝福語…</div></section>
  <a class="btn" href="/">返回每日平安卡</a>
</main><script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script><script>
(async()=>{try{await liff.init({liffId:'2010848330-UAiqPPYD'});if(!liff.isLoggedIn()){liff.login({redirectUri:location.href});return;}const token=String(liff.getIDToken()||'');const r=await fetch('/api/daily-care',{headers:{Authorization:'Bearer '+token,'X-Line-Id-Token':token}});const d=await r.json();if(!r.ok)throw new Error(d.error||'load_failed');document.querySelector('#greeting').textContent=d.greeting+'，今日安心提醒';document.querySelector('#weather').textContent=d.weather_line;document.querySelector('#level').textContent=d.level_progress_text;document.querySelector('#gameBadge').textContent=(d.reward_icon||'🏅')+' 遊戲勳章：'+d.game_badge_name;document.querySelector('#upgradeReward').textContent='升級特效：'+d.reward_name;document.querySelector('#newsTitle').textContent='📰 '+d.news_title;document.querySelector('#newsSummary').textContent=d.news_summary;document.querySelector('#blessing').textContent=d.blessing_text;document.querySelector('#source').textContent='來源：'+d.news_source_name+'｜更新：'+d.updated_at;document.querySelector('#sourceLink').href=d.news_source_url;const reminders=Array.isArray(d.today_reminders)?d.today_reminders:[];document.querySelector('#reminders').innerHTML=reminders.length?reminders.map(x=>'<div class="reminder"></div>').join(''):'<div class="reminder empty">今天沒有其他提醒，安心過好每一天。</div>';document.querySelectorAll('#reminders .reminder').forEach((el,i)=>{if(reminders[i])el.textContent=reminders[i].text;});}catch(e){document.querySelector('#weather').textContent='資料暫時無法讀取，請從每日平安 LINE 重新開啟。';document.querySelector('#newsSummary').textContent='稍後再回來看看，今天也請照顧好自己。';document.querySelector('#reminders').innerHTML='<div class="reminder empty">提醒資料暫時無法讀取。</div>';document.querySelector('#sourceLink').hidden=true;}})();
  </script></body></html>
