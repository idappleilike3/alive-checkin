    // SOS FAB：所有方案皆可開啟並通知家人（不鎖 799）。
    function bindSosFab() {
      const fab = $("sosFab");
      const modal = $("sosConfirmModal");
      const cancelBtn = $("sosConfirmCancel");
      const holdButton = $("sosHoldButton");
      const holdProgress = $("sosHoldProgress");
      const holdLabel = $("sosHoldLabel");
      const cancelSentBtn = $("sosCancelSentBtn");
      if (!fab || !modal || !cancelBtn || !holdButton || fab.dataset.bound === "true") return;
      fab.dataset.bound = "true";
      let sosTapCount = 0;
      let sosTapTimer = null;

      const resetSosTap = () => {
        if (sosTapTimer) clearTimeout(sosTapTimer);
        sosTapTimer = null;
        sosTapCount = 0;
        sosLocationPromise = null;
        sosLocationDeadlinePromise = null;
        holdProgress.style.transition = "none";
        holdProgress.style.width = "0";
        holdLabel.textContent = "聯絡家人連按3次";
      };
      const handleSosTap = async (event) => {
        if (holdButton.disabled) return;
        event.preventDefault();
        sosTapCount += 1;
        if (sosTapCount === 1) startSosLocationLookup();
        holdProgress.style.transition = "width 160ms ease";
        holdProgress.style.width = `${Math.min(100, sosTapCount * 34)}%`;
        holdLabel.textContent = `已按 ${sosTapCount}/3 次`;
        $("sosFeedback").textContent = sosTapCount < 3 ? "再按一次，確認才會送出" : "已確認，正在送出 SOS";
        if (sosTapTimer) clearTimeout(sosTapTimer);
        sosTapTimer = setTimeout(resetSosTap, 2400);
        if (sosTapCount >= 3) {
          if (sosTapTimer) clearTimeout(sosTapTimer);
          sosTapTimer = null;
          await sendSosAlert(startSosLocationLookup());
          setTimeout(resetSosTap, 1200);
        }
      };

      fab.addEventListener("click", openSosFlow);
      cancelBtn.addEventListener("click", () => { resetSosTap(); modal.hidden = true; });
      if (cancelSentBtn) {
        cancelSentBtn.addEventListener("click", async () => {
          const eventId = cancelSentBtn.dataset.eventId || "";
          if (!eventId) return;
          const reason = window.prompt("請選填取消原因，例如：誤觸、已由家人聯絡確認", "誤觸") || "誤觸";
          cancelSentBtn.disabled = true;
          try {
            const result = await apiCancelSos(eventId, reason);
            const cancelFailed = Number(result.cancel_failed) || 0;
            $("sosFeedback").textContent = cancelFailed > 0
              ? `已通知 ${Number(result.cancel_sent) || 0} 位，另有 ${cancelFailed} 位取消通知失敗，請直接聯絡對方`
              : `已通知 ${Number(result.cancel_sent) || 0} 位原收件人：目前安全，原 SOS 紀錄會保留`;
            cancelSentBtn.hidden = cancelFailed === 0;
          } catch (error) {
            const details = (error && error.details) || {};
            const failed = Number(details.cancel_failed) || 0;
            $("sosFeedback").textContent = failed > 0
              ? `已有 ${Number(details.cancel_sent) || 0} 位收到取消，但 ${failed} 位仍失敗；請直接聯絡對方，稍後可再按一次重試`
              : error.status === 409
                ? "取消處理中或已超過 10 分鐘；請直接聯絡家人報平安"
                : "取消通知暫時失敗，請直接聯絡家人報平安";
          } finally {
            cancelSentBtn.disabled = false;
          }
        });
      }
      $("sosRefreshStatusBtn")?.addEventListener("click", () => {
        refreshSosLiveStatus($("sosLiveStatus").dataset.eventId || "");
      });
      $("sosSafeCloseBtn")?.addEventListener("click", async () => {
        const eventId = $("sosLiveStatus").dataset.eventId || "";
        if (!eventId || !confirm("確認你目前安全，並結束這次 SOS？")) return;
        renderSosLiveStatus(await apiCloseSosSafe(eventId));
      });
      modal.addEventListener("click", (event) => {
        if (event.target === modal) { resetSosTap(); modal.hidden = true; }
      });
      holdButton.addEventListener("click", handleSosTap);
      holdButton.addEventListener("keydown", (event) => {
        if (event.key === " " || event.key === "Enter") handleSosTap(event);
      });    }

    async function maybeShowGuardianComplete() {
      if (!lineUserId) return;
      if (hasHomeSetupComplete(currentGuardianContacts())) return;
      try {
        const r = await fetch(`/api/interaction-state?line_user_id=${encodeURIComponent(lineUserId)}`);
        if (r.status !== 200) return;
        const data = await r.json();
        const istate = data.interaction_state || {};
        // 從 contacts 拿當前數量
        const cr = await fetch(`/api/contacts?line_user_id=${encodeURIComponent(lineUserId)}`);
        if (cr.status !== 200) return;
        const cdata = await cr.json();
        const count = (cdata.contacts || []).length;
        const limit = cdata.contact_limit || 1;
        // 判斷:399/799 + 未填滿 + 沒被 dismiss
        if (limit <= 1) return; // 未訂閱／體驗基準不再催
        if (count >= limit) return;
        const pref = istate.guardian_reminder_preference || "";
        if (pref === "dismissed") return;
        if (pref === "tomorrow" || pref === "dismiss_7d") {
          const until = istate.guardian_reminder_snoozed_until || "";
          if (until && new Date(until).getTime() > Date.now()) return;
        }
        // 顯示
        const modal = $("guardianCompleteModal");
        const title = $("guardianPromptTitle");
        const body = $("guardianPromptBody");
        const cnt = $("guardianPromptCount");
        if (title) title.textContent = "守護群尚未填滿";
        if (body) body.innerHTML = `你的守護群目前為 <strong>${count}/${limit}</strong> 位。多設定一位守護人,緊急時就多一層保障。`;
        if (cnt) cnt.textContent = `${count}/${limit}`;
        modal.hidden = false;
      } catch (e) {
        console.warn("guardian complete check failed", e);
      }
    }

    const memberAddGuardianBtn = $("memberAddGuardianBtn");
    if (memberAddGuardianBtn) {
      memberAddGuardianBtn.addEventListener("click", () => {
        setMemberContactTab("core");
        openAddGuardianFromMember();
      });
    }
    const smartReminderAddBtn = $("smartReminderAddBtn");
    if (smartReminderAddBtn) smartReminderAddBtn.addEventListener("click", () => openSmartReminderEditor(null));
    const smartReminderUpgradeBtn = $("smartReminderUpgradeBtn");
    if (smartReminderUpgradeBtn) {
      smartReminderUpgradeBtn.addEventListener("click", () => {
        location.href = "https://alive-checkin.onrender.com/liff/pricing.html";
      });
    }
    const memberAddEmergencyBtn = $("memberAddEmergencyBtn");
    if (memberAddEmergencyBtn) {
      memberAddEmergencyBtn.addEventListener("click", () => {
        if (!requireLineMembership("新增緊急聯絡人前，請先完成 LINE 登入綁定。")) return;
        if (typeof showTab === "function") showTab("member");
        setMemberCenterExpanded(true);
        setMemberContactTab("emergency");
        openGuardianEditor(null, "emergency");
      });
    }
    const memberShareGuardianBtn = $("memberShareGuardianBtn");
    if (memberShareGuardianBtn) memberShareGuardianBtn.addEventListener("click", shareContactInvite);
    const smartRemindersToggleBtn = $("smartRemindersToggleBtn");
    if (smartRemindersToggleBtn) {
      smartRemindersToggleBtn.addEventListener("click", () => {
        const open = smartRemindersToggleBtn.getAttribute("aria-expanded") !== "true";
        setSmartRemindersExpanded(open);
      });
    }
    const dailyToggle = $("dailyCheckinReminderEnabled");
    if (dailyToggle) dailyToggle.addEventListener("change", renderMemberDailyReminderUi);
    const dailyCountRow = $("memberDailyReminderCountRow");
    if (dailyCountRow) {
      dailyCountRow.addEventListener("click", (event) => {
        const btn = event.target.closest(".daily-remind-count-btn");
        if (!btn || btn.disabled || btn.hidden) return;
        const status = currentStatusData || {};
        const maxCount = planMaxDailyReminderCount(status);
        const next = Math.max(1, Math.min(maxCount, Number(btn.dataset.count) || 1));
        selectedDailyReminderCount = next;
        const existing = Array.isArray(status.reminder_times) ? status.reminder_times.slice() : [];
        const defaults = defaultTimesForDailyCount(next);
        const merged = [];
        for (let i = 0; i < next; i++) merged.push(existing[i] || defaults[i] || "12:00");
        if (currentStatusData) currentStatusData.reminder_times = merged;
        renderMemberDailyReminderUi();
      });
    }
    const graceHoursRow = $("memberGraceHoursRow");
    if (graceHoursRow) {
      graceHoursRow.addEventListener("click", (event) => {
        const btn = event.target.closest(".grace-hours-btn");
        if (!btn) return;
        selectedGraceHours = normalizeGraceHoursClient(btn.dataset.minutes || 15);
        if (currentStatusData) currentStatusData.overdue_wait_minutes = selectedGraceHours;
        renderGraceHoursButtons(currentStatusData || {});
      });
    }
    const missedHoursRow = $("memberMissedHoursRow");
    if (missedHoursRow) {
      missedHoursRow.addEventListener("click", (event) => {
        const btn = event.target.closest(".missed-hours-btn");
        if (!btn) return;
        selectedMissedHours = normalizeMissedHoursClient(btn.dataset.hours || 48);
        if (currentStatusData) currentStatusData.grace_hours = selectedMissedHours;
        renderGraceHoursButtons(currentStatusData || {});
      });
    }
    const dailyDefaultsBtn = $("memberDailyReminderDefaultsBtn");
    if (dailyDefaultsBtn) {
      dailyDefaultsBtn.addEventListener("click", applyAndSaveMemberReminderDefaults);
    }
    const saveDailyReminderBtn = $("saveDailyReminderBtn");
    if (saveDailyReminderBtn) saveDailyReminderBtn.addEventListener("click", saveMemberDailyReminder);
    const memberSupportForm = $("memberSupportForm");
    if (memberSupportForm) memberSupportForm.addEventListener("submit", submitMemberSupportTicket);
    const memberRefundForm = $("memberRefundForm");
    if (memberRefundForm) memberRefundForm.addEventListener("submit", submitMemberRefundRequest);
    const smartReminderCategory = $("smartReminderCategory");
    if (smartReminderCategory) {
      smartReminderCategory.addEventListener("change", () => {
        syncSmartReminderCustomTitleVisibility();
        if (!smartReminderEditingId && $("smartReminderYearly")) {
          $("smartReminderYearly").checked = smartReminderCategoryRepeatsYearly(smartReminderCategory.value);
        }
      });
    }
    const smartReminderCancelBtn = $("smartReminderCancelBtn");
    if (smartReminderCancelBtn) smartReminderCancelBtn.addEventListener("click", closeSmartReminderEditor);
    const smartReminderSaveBtn = $("smartReminderSaveBtn");
    if (smartReminderSaveBtn) smartReminderSaveBtn.addEventListener("click", submitSmartReminderEditor);
    const smartReminderEditorModal = $("smartReminderEditorModal");
    if (smartReminderEditorModal) {
      smartReminderEditorModal.addEventListener("click", (event) => {
        if (event.target === smartReminderEditorModal) closeSmartReminderEditor();
      });
    }
    function updateGuardianGroupPreferenceCount(groupId) {
      const list = $("guardianGroupsList");
      if (!list || !groupId) return;
      const checkboxes = Array.from(
        list.querySelectorAll(`.guardian-group-pref[data-group-id="${CSS.escape(groupId)}"]`)
      );
      const count = checkboxes.filter((checkbox) => checkbox.checked).length;
      const label = list.querySelector(
        `.guardian-group-pref-count[data-group-id="${CSS.escape(groupId)}"]`
      );
      if (label) label.textContent = `目前已開啟 ${count}/4 項`;
    }
    $("guardianGroupsList").addEventListener("change", (event) => {
      const checkbox = event.target.closest(".guardian-group-pref");
      if (checkbox) updateGuardianGroupPreferenceCount(checkbox.dataset.groupId);
    });
    $("guardianGroupsList").addEventListener("click", (event) => {
      const unbindButton = event.target.closest(".guardian-group-unbind");
      if (unbindButton) {
        unbindGuardianGroup(unbindButton.dataset.groupId);
        return;
      }
      const saveButton = event.target.closest(".guardian-group-save");
      if (!saveButton) return;
      const groupId = saveButton.dataset.groupId;
      const checkboxes = Array.from(
        $("guardianGroupsList").querySelectorAll(`.guardian-group-pref[data-group-id="${CSS.escape(groupId)}"]`)
      );
      const preferences = Object.fromEntries(
        checkboxes.map((checkbox) => [checkbox.dataset.prefKey, checkbox.checked])
      );
      const summaryTime = $("guardianGroupsList").querySelector(
        `.guardian-group-summary-time[data-group-id="${CSS.escape(groupId)}"]`
      );
      preferences.daily_summary_time = summaryTime?.value || "20:00";
      saveButton.disabled = true;
      saveButton.textContent = "儲存中…";
      apiSaveGuardianGroupPreferences(groupId, preferences)
        .then(async () => {
          showInlineSuccess("守護群設定已儲存");
          await refreshStatus();
        })
        .catch(() => alert("守護群設定暫時無法儲存，請稍後再試。"))
        .finally(() => {
          saveButton.disabled = false;
          saveButton.textContent = "儲存守護群設定";
        });
    });
    $("calendarGrid").addEventListener("click", (event) => {
      const dayButton = event.target.closest(".day-cell[data-date]");
      if (dayButton) openCalendarNote(dayButton.dataset.date);
    });
    $("closeCalendarNoteBtn").addEventListener("click", closeCalendarNote);
    $("saveCalendarNoteBtn").addEventListener("click", () => saveSelectedCalendarNote());
    $("deleteCalendarNoteBtn").addEventListener("click", () => saveSelectedCalendarNote(""));
    $("calendarNoteInput").addEventListener("input", () => {
      const chosenDate = String($("calendarNoteDate").value || selectedCalendarDate || "");
      if (chosenDate) {
        $("googleCalendarLink").href = googleCalendarUrl(chosenDate, $("calendarNoteInput").value.trim());
      }
    });
    $("calendarNoteDate").addEventListener("change", () => {
      const chosenDate = String($("calendarNoteDate").value || "");
      if (chosenDate) {
        $("googleCalendarLink").href = googleCalendarUrl(chosenDate, $("calendarNoteInput").value.trim());
      }
    });
    $("calendarNoteModal").addEventListener("click", (event) => {
      if (event.target === $("calendarNoteModal")) closeCalendarNote();
    });
    $("prevMonth").addEventListener("click", () => changeMonth(-1));
    $("nextMonth").addEventListener("click", () => changeMonth(1));

    setTheme(localStorage.getItem("preferred_theme") || "classic");
    maybePrefillFriendInvite();
    bindLineEntryGate();
    // 勿在 lineUserId 就緒前顯示同意視窗（會造成「要點兩次」）

    async function resumeMemberBootstrapAfterLineEntry() {
      const hasPendingMigration = Boolean(getAppParam("migration_code"));
      const migration = hasPendingMigration
        ? await redeemPendingAccountMigration()
        : { attempted: false, succeeded: false };
      const memberReady = await initApp();
      if (!memberReady) return false;
      if (hasPendingMigration && migration.succeeded) {
        const migratedRoute = applyInitialDeepLinkRoute();
        if (migratedRoute.redirected) return true;
      }
      if (useLocalMode) renderStatus(buildLocalStatus(loadLocalState()));
      await refreshCalendarNotes();
      if (!useLocalMode) {
        refreshFriendLocations().catch(() => {});
      }
      openRequestedPage();
      return true;
    }

    async function bootstrapApp() {
      appBootstrapComplete = false;
      memberBootstrapState.statusReady = false;
      memberBootstrapState.dataReady = false;
      memberBootstrapState.guardianRequired = false;
      memberBootstrapState.error = null;
      setMemberInteractionLocked(true);
      if (requestedAppAction() === "onboarding" || getAppParam("beta_cohort")) {
        showLineEntryLoadingGate();
      }
      // 導覽與基本操作不依賴 LINE 身分；先綁定再套用 deep link，畫面不必等網路。
      bindTabEvents();
      bindSosFab();
      bindMvpHome();
      bindGuardianCompletePrompt();
      bindGuardianEvents();
      bindPeaceHelper();
      bindGuardianBindingCelebration();
      setInterval(() => {
        if (xiaoPinganState !== "idle" || document.hidden) return;
        const idleAnimations = ["smile", "blink", "float", "heartbeat"];
        playXiaoPinganAnimation(idleAnimations[Math.floor(Math.random() * idleAnimations.length)], "idle");
      }, 12000);
      const hasPendingMigration = Boolean(getAppParam("migration_code"));
      if (!hasPendingMigration) {
        const initialRoute = applyInitialDeepLinkRoute();
        if (initialRoute.redirected) return;
      }
      try {
        const lineReady = lineUserId ? true : await initLine();
        if (!useLocalMode && (!lineReady || !lineUserId)) {
          showLineLoginRequired();
          // 外部瀏覽器不自動導轉，避免 LINE OAuth 反覆登入循環；讓使用者按「用 LINE 開啟」。
          return;
        }
        // 邀請流程只需要已驗證的 LINE 身分；先顯示接受／自邀請提示，
        // 不必等待首頁狀態、聯絡人與 onboarding 三組資料全部載入。
        if (getAppParam("invite_from")) {
          maybeShowInviteAcceptPrompt();
        }

        const migration = hasPendingMigration
          ? await redeemPendingAccountMigration()
          : { attempted: false, succeeded: false };
        const memberReady = await initApp();
        if (!memberReady) return;
        if (hasPendingMigration && migration.succeeded) {
          const migratedRoute = applyInitialDeepLinkRoute();
          if (migratedRoute.redirected) return;
        }
        if (useLocalMode) renderStatus(buildLocalStatus(loadLocalState()));
        await refreshCalendarNotes();
        if (!useLocalMode) {
          refreshFriendLocations().catch(() => {});
        }
        openRequestedPage();
      } catch (error) {
        console.warn("頁面初始化失敗", error);
        showMemberBootstrapError(error);
      } finally {
        document.body.removeAttribute("aria-busy");
        delete document.body.dataset.initialRoute;
        appBootstrapComplete = true;
      }
    }

    appBootstrapPromise = bootstrapApp();
    setInterval(() => {
      if (document.visibilityState === "visible" && lineUserId) {
        refreshStatus().catch((error) => console.warn("狀態更新失敗", error));
      }
    }, 60000);
  </script>


</body>
